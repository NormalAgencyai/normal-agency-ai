<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Agency | وكالة نورمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <nav class="top-bar">
        <div class="brand-mini">NORMAL AGENCY</div>
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">
            <span>🌐</span> 
            <span id="langText">العربية / English / Français</span>
        </button>
    </nav>

    <div class="container">
        <!-- قسم الهيدر الرئيسي والشعار -->
        <header class="hero-section">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Normal Agency Logo" class="logo" onerror="this.src='https://via.placeholder.com/300x150/0f172a/0072ce?text=NORMAL'">
            </div>
            <h1 class="hero-title" data-en="Normal Agency" data-ar="نورمال للخدمات الإلكترونية المتكاملة" data-fr="Agence Normal">
                نورمال للخدمات الإلكترونية المتكاملة
            </h1>
            <p class="sub-title" data-en="From Idea to Execution | Integrated Digital & Creative Solutions" data-ar="من الفكرة إلى التنفيذ | حلول رقمية وإبداعية متكاملة" data-fr="De l'idée à l'exécution | Solutions numériques et créatives intégrées">
                من الفكرة إلى التنفيذ | حلول رقمية وإبداعية متكاملة
            </p>
        </header>

        <!-- قسم الخدمات الاربع الرئيسية -->
        <main id="services-section">
            <div class="section-header">
                <h2 class="section-title" data-en="Our Services" data-ar="خدماتنا الإبداعية" data-fr="Nos Services">خدماتنا الإبداعية</h2>
            </div>

            <div class="services-grid">
                <!-- كرت نورمال ديجيتال -->
                <div class="card" onclick="openModal('Digital')">
                    <div class="card-icon">⚡</div>
                    <h3 data-en="Normal Digital" data-ar="نورمال ديجيتال" data-fr="Normal Digital">نورمال ديجيتال</h3>
                    <span class="badge">15 خدمة فرعية</span>
                </div>

                <!-- كرت نورمال ستوديو -->
                <div class="card" onclick="openModal('Studio')">
                    <div class="card-icon">🎬</div>
                    <h3 data-en="Normal Studio" data-ar="نورمال ستوديو" data-fr="Normal Studio">نورمال ستوديو</h3>
                    <span class="badge">15 خدمة فرعية</span>
                </div>

                <!-- كرت نورمال آرت -->
                <div class="card" onclick="openModal('Art')">
                    <div class="card-icon">🎨</div>
                    <h3 data-en="Normal Art" data-ar="نورمال آرت" data-fr="Normal Art">نورمال آرت</h3>
                    <span class="badge">15 خدمة فرعية</span>
                </div>

                <!-- كرت نورمال برينت -->
                <div class="card" onclick="openModal('Print')">
                    <div class="card-icon">💎</div>
                    <h3 data-en="Normal Print" data-ar="نورمال برينت" data-fr="Normal Print">نورمال برينت</h3>
                    <span class="badge">15 خدمة فرعية</span>
                </div>
            </div>
        </main>
    </div>

    <!-- النافذة المنبثقة والمعرض (Modal) -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal()">✖</button>
            
            <h3 id="modalTitle" class="modal-title">عنوان الخدمة</h3>

            <!-- عرض نموذج العمل -->
            <div class="work-sample-box">
                <img id="modalWorkSample" src="" alt="Work Sample" class="work-sample-img">
            </div>

            <label class="input-label" data-en="Select sub-service:" data-ar="اختر الخدمة الفرعية من الـ 15 خدمة التالية:" data-fr="Sélectionnez le service:">اختر الخدمة الفرعية من الـ 15 خدمة التالية:</label>
            
            <!-- حاوية الخدمات الفرعية الـ 60 -->
            <div id="subServicesContainer" class="sub-services-grid"></div>

            <hr class="divider">

            <!-- نموذج إرسال الطلب -->
            <form action="https://formspree.io/f/xykvqjek" method="POST" class="agency-form">
                <input type="text" id="serviceName" name="Service" readonly required placeholder="اختر خدمة من المربعات أعلاه..." data-en-placeholder="Select a service above..." data-ar-placeholder="اختر خدمة من المربعات أعلاه..." data-fr-placeholder="Sélectionnez un service...">
                <input type="email" name="Email" required placeholder="بريدك الإلكتروني" data-en-placeholder="Your Email" data-ar-placeholder="بريدك الإلكتروني" data-fr-placeholder="Votre Email">
                <textarea name="Details" rows="3" required placeholder="تفاصيل الطلب..." data-en-placeholder="Order Details..." data-ar-placeholder="تفاصيل الطلب..." data-fr-placeholder="Détails de la commande..."></textarea>
                
                <button type="submit" class="submit-btn" data-en="Send Request" data-ar="إرسال الطلب" data-fr="Envoyer la demande">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- الشريط السفلي العائم -->
    <nav class="bottom-nav">
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" data-en="Home" data-ar="الرئيسية" data-fr="Accueil">الرئيسية</a>
        <a href="#services-section" data-en="Services" data-ar="خدماتنا" data-fr="Services">خدماتنا</a>
        <a href="https://wa.me/966543262920" target="_blank" class="highlight-link" data-en="Contact Us" data-ar="تواصل معنا" data-fr="Contactez-nous">تواصل معنا</a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
